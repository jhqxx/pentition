appId: com.lbxq.petitiondesktop
productName: Petition
# 图标按约定从 build/ 读取：Windows 用 icon.ico（16/32/48/64/128 原生 + 256），
# macOS 用 icon.icns，Linux 用 icon.png；不写 icon 字段，避免被强制转成单一 png。
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
# 随包发布的示例库：全新安装时复制到 <程序目录>/data/petition.db，打开即有测试数据
extraResources:
  - from: resources/seed
    to: seed
    filter:
      - petition.db
afterPack: ./scripts/afterPack.cjs
npmRebuild: false # better-sqlite3 v13 自带各平台 N-API 预编译产物，任一平台都不需要 node-gyp/VS 编译工具链
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.business
  identity: null
  extendInfo:
    CFBundleDisplayName: 审查调查工作平台
dmg:
  title: 审查调查工作平台
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: Petition-Setup-${version}.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: 审查调查工作平台
portable:
  artifactName: Petition-${version}-portable.exe
