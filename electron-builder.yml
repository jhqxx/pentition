appId: com.lbxq.petitiondesktop
productName: PetitionDesktop
icon: build/icon.png
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
afterPack: ./scripts/afterPack.cjs
npmRebuild: false # better-sqlite3 v13 自带各平台 N-API 预编译产物，任一平台都不需要 node-gyp/VS 编译工具链
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.business
  identity: null
  extendInfo:
    CFBundleDisplayName: 审查调查工作平台
dmg:
  title: 审查调查工作平台
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: PetitionDesktop-Setup-${version}.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: 审查调查工作平台
portable:
  artifactName: PetitionDesktop-${version}-portable.exe
