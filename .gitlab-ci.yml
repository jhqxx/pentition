# GitLab 原生 Runner 流水线
# Runner：lab-docker-runner（docker executor，host 网络，镜像 pbuild:wine32 本地复用）
# 宿主缓存：/srv/build/cache/{electron,electron-builder,pnpm} → 容器内 ~/.cache/*
#
# 分支与发布约定：
#   dev / master  —— 只跑 verify-version（版本自检），不构建、不发布
#   Merge Request —— 只跑 verify-version
#   tag vX.Y.Z    —— 全量：verify → build → upload → release（唯一的发布入口）
#   Web 手动      —— 可手动跑构建做验证，但不会上传/发布

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

stages:
  - verify
  - build
  - package
  - release
  - api-test
  - deploy

variables:
  GITLAB_API: "http://10.175.2.11:8082/api/v4"
  GITLAB_PROJECT_ID: "1"
  GITLAB_PKG_NAME: "petition-desktop"
  BUILD_IMAGE: "pbuild:wine32"
  APIFOX_IMAGE: "pbuild/apifox-cli:2.2.12"
  # 依赖与二进制一律走国内镜像（直连），流水线内不配置任何代理
  npm_config_registry: "https://registry.npmmirror.com"
  ELECTRON_MIRROR: "https://registry.npmmirror.com/-/binary/electron/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://registry.npmmirror.com/-/binary/electron-builder-binaries/"
  GIT_DEPTH: "20"

default:
  image: pbuild:wine32
  tags:
    - docker
  interruptible: true
  timeout: 90m

# ---------- 1. 版本校验 ----------
verify-version:
  stage: verify
  script:
    - |
      set -eu
      VERSION=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
      if [ -z "$VERSION" ]; then
        echo "package.json 里读不到 version"; exit 1
      fi
      if [ -n "${CI_COMMIT_TAG:-}" ] && [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
        echo "tag $CI_COMMIT_TAG 与 package.json 版本 $VERSION 不一致"; exit 1
      fi
      if [ -z "${CI_COMMIT_TAG:-}" ]; then
        echo "当前不是 tag 流水线（$CI_COMMIT_REF_NAME）→ 只做版本自检，不构建、不发布"
      fi
      echo "APP_VERSION=$VERSION" > version.env
      echo "APP_TAG=${CI_COMMIT_TAG:-}" >> version.env
      cat version.env
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 1 day

# ---------- 2. Windows 构建（仅 tag；Web 可手动试跑） ----------
build-windows:
  stage: build
  needs: ["verify-version"]
  script:
    - node -v && pnpm -v
    - rm -rf release
    - pnpm install --frozen-lockfile --reporter=append-only
    - pnpm build
    - pnpm exec electron-builder --win nsis portable --x64 --publish never
    - ls -lh release/*.exe
  artifacts:
    name: "PetitionDesktop-$APP_VERSION"
    paths:
      - release/*.exe
      - release/*.yml
      - release/*.blockmap
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# ---------- 3. 上传到 GitLab 通用包仓库（仅 tag = 发布） ----------
upload-package:
  stage: package
  needs: ["verify-version", "build-windows"]
  script:
    - |
      set -eu
      for f in release/*.exe; do
        name=$(basename "$f")
        encoded=$(printf '%s' "$name" | sed 's/ /%20/g')
        url="$GITLAB_API/projects/$GITLAB_PROJECT_ID/packages/generic/$GITLAB_PKG_NAME/$APP_VERSION/$encoded"
        code=$(curl -s -o /tmp/upload.log -w '%{http_code}' --upload-file "$f" \
               -H "PRIVATE-TOKEN: $GITLAB_TOKEN" "$url")
        echo "upload $name => HTTP $code"
        if [ "$code" != "201" ] && [ "$code" != "200" ]; then cat /tmp/upload.log; exit 1; fi
      done
  rules:
    - if: $CI_COMMIT_TAG

# ---------- 4. 创建 Release 并挂资产链接（仅 tag） ----------
release:
  stage: release
  needs: ["verify-version", "upload-package"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu
      TAG="$APP_TAG"
      VER="${TAG#v}"
      PKG="http://10.175.2.11:8082/lbxq/petition-desktop/-/packages"
      DL="http://10.175.2.11:8082/api/v4/projects/$GITLAB_PROJECT_ID/packages/generic/$GITLAB_PKG_NAME"
      DESC="PetitionDesktop ${VER}：Windows 安装包与免安装版由 GitLab Runner 构建（wine 交叉编译），产物见包仓库 ${PKG}。"
      BODY=$(printf '{"name":"%s","tag_name":"%s","description":"%s"}' "$TAG" "$TAG" "$DESC")

      code=$(curl -s -o /tmp/rel.json -w '%{http_code}' -X POST "$GITLAB_API/projects/$GITLAB_PROJECT_ID/releases" \
            -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H 'Content-Type: application/json' --data "$BODY")
      if [ "$code" = "201" ]; then
        echo "Release $TAG 已创建"
      elif [ "$code" = "409" ]; then
        curl -s -o /dev/null -X PUT "$GITLAB_API/projects/$GITLAB_PROJECT_ID/releases/$TAG" \
          -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H 'Content-Type: application/json' --data "$BODY"
        echo "Release $TAG 已存在，已更新"
      else
        echo "创建 Release 失败 HTTP $code"; cat /tmp/rel.json; exit 1
      fi

      for kind in Setup portable; do
        if [ "$kind" = "Setup" ]; then
          fname="PetitionDesktop-Setup-$VER.exe"
        else
          fname="PetitionDesktop-$VER-portable.exe"
        fi
        ename=$(printf '%s' "$fname" | sed 's/ /%20/g')
        LINK=$(printf '{"name":"%s","url":"%s/%s/%s","link_type":"package"}' "$fname" "$DL" "$VER" "$ename")
        lcode=$(curl -s -o /tmp/link.json -w '%{http_code}' -X POST "$GITLAB_API/projects/$GITLAB_PROJECT_ID/releases/$TAG/assets/links" \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H 'Content-Type: application/json' --data "$LINK")
        if [ "$lcode" = "201" ] || [ "$lcode" = "409" ]; then
          echo "Release 资产链接 $fname => HTTP $lcode"
        else
          echo "添加资产链接失败 $fname HTTP $lcode"; cat /tmp/link.json
        fi
      done

# ---------- 5. 接口冒烟门禁（手动触发，不拖累主链路） ----------
api-smoke:
  stage: api-test
  image: pbuild/apifox-cli:2.2.12
  needs: []
  allow_failure: true
  script:
    - |
      if [ -z "${APIFOX_SUITE_ID:-}" ]; then
        echo "APIFOX_SUITE_ID 为空 → 最小验证模式（仅校验 CLI 版本）"
        apifox --version
      else
        apifox login --with-token "$APIFOX_TOKEN"
        apifox test-suite run "$APIFOX_SUITE_ID" \
          --project "$APIFOX_PROJECT_ID" --environment "$APIFOX_ENV_ID" \
          --reporters cli,json,junit --out-dir test-reports --upload-report
      fi
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/*.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev"
      when: manual
    - when: never

# ---------- 6. 部署禅道→GitLab 桥（GitLab 管自己的运维脚本） ----------
# 源码 ops/zentao-bridge/，本作业只把文件铺到宿主 /srv/zentao-bridge/；
# 重启由宿主 systemd 的 path 单元侦测文件变化后触发 oneshot restart 完成，
# 因此 CI 作业不需要 systemctl 权限。Runner 需挂载 /srv -> /deploy。
# 校验方式：bridge 启动时把自身源码 sha256 报在 /health，这里轮询比对，
# 一致才说明「新代码确实被加载了」，而不是老进程还在应答。
deploy-bridge:
  stage: deploy
  image: pbuild:wine32
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
        - ops/zentao-bridge/**/*
      when: manual
    - when: never
  script:
    - |
      set -eu
      DEST=/deploy/zentao-bridge
      mkdir -p "$DEST"
      install -m 0644 ops/zentao-bridge/bridge.py "$DEST/bridge.py"
      WANT=$(sha256sum "$DEST/bridge.py" | cut -d' ' -f1)
      echo "期望源码 sha256 = $WANT"
      for i in $(seq 1 30); do
        GOT=$(curl -fsS http://127.0.0.1:8099/health 2>/dev/null | sed -n 's/.*"source_sha256": *"\([0-9a-f]*\)".*/\1/p' || true)
        if [ "$GOT" = "$WANT" ]; then
          echo "桥已加载新代码（pid 已换），健康检查通过"
          curl -fsS http://127.0.0.1:8099/health; echo
          exit 0
        fi
        sleep 2
      done
      echo "60 秒内未加载新代码，当前上报 sha=$GOT"
      echo "排查：systemctl status zentao-bridge zentao-bridge.path；journalctl -u zentao-bridge -n 30"
      exit 1
