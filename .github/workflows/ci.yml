name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 版本与构建校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: 构建渲染层与主进程
        run: pnpm build
      - name: 版本自检
        id: ver
        shell: bash
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "tag ${GITHUB_REF_NAME} 与 package.json 版本 ${VERSION} 不一致" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=${VERSION}"

  build-windows:
    name: Windows 安装包
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile 2>&1 | tee install.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            { echo '### pnpm install 失败（Windows）'; echo '```'; tail -80 install.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
      - run: pnpm build
      - name: 打包 Windows（nsis + portable）
        run: pnpm exec electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Petition-Windows-${{ needs.verify.outputs.version }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  build-macos:
    name: macOS 安装包 (arm64)
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile 2>&1 | tee install.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            { echo '### pnpm install 失败（macOS）'; echo '```'; tail -80 install.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
      - run: pnpm build
      - name: 打包 macOS（dmg arm64，未签名）
        run: pnpm exec electron-builder --mac --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Petition-macOS-${{ needs.verify.outputs.version }}
          path: |
            release/*.dmg
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs: [verify, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 列出产物
        run: ls -lhR artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Petition ${{ needs.verify.outputs.version }}
          body: |
            Petition ${{ needs.verify.outputs.version }}（信访管理系统桌面版 · 审查调查工作平台）
            - Windows：安装版 (Setup) + 免安装版 (portable)
            - macOS：dmg（arm64，未签名，首次打开需右键→打开）
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.blockmap
          fail_on_unmatched_files: false
